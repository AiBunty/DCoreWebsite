<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept 1: Futuristic (Neon Command Center)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #05050f; color: white; overflow-x: hidden; font-family: system-ui, -apple-system, sans-serif; }
        .grid-bg {
            position: absolute; inset: 0; z-index: -1;
            background-size: 50px 50px;
            background-image: linear-gradient(to right, rgba(148, 163, 184, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(148, 163, 184, 0.05) 1px, transparent 1px);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 0 20px rgba(148, 163, 184, 0.05);
        }
        .neon-text {
            background: linear-gradient(135deg, #9ca3af 0%, #6b7280 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }
        .glow-button {
            background: linear-gradient(90deg, #374151, #4b5563);
            box-shadow: 0 0 15px rgba(31, 41, 55, 0.5);
            transition: all 0.3s ease;
        }
        .glow-button:hover {
            box-shadow: 0 0 25px rgba(31, 41, 55, 0.8);
            transform: translateY(-2px);
        }
        .blob {
            position: absolute; filter: blur(80px); z-index: -1; border-radius: 50%;
            animation: pulse 8s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }
    </style>
</head>
<body class="relative min-h-screen flex flex-col items-center">
    <div class="grid-bg"></div>
    
    <!-- Neon Blobs -->
    <div class="blob bg-gray-600/30 w-96 h-96 top-20 left-10"></div>
    <div class="blob bg-gray-500/20 w-80 h-80 top-40 right-10"></div>

    <!-- Nav -->
    <nav class="w-full max-w-7xl mx-auto px-6 py-6 flex justify-between items-center z-10">
        <div class="text-2xl font-black tracking-widest text-white flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-gray-400 shadow-[0_0_10px_rgba(34,211,238,0.8)]"></div>
            DCORE
        </div>
        <div class="space-x-8 text-sm font-medium text-slate-300">
            <a href="#" class="hover:text-gray-400 transition">Platform</a>
            <a href="#" class="hover:text-gray-400 transition">Solutions</a>
            <a href="#" class="hover:text-gray-400 transition">Pricing</a>
        </div>
        <button class="glass-panel px-6 py-2 rounded-full text-gray-400 font-bold hover:bg-gray-950/50 transition border border-gray-500/50">
            Login
        </button>
    </nav>

    <!-- Hero -->
    <main class="w-full max-w-7xl mx-auto px-6 mt-20 grid grid-cols-1 lg:grid-cols-2 gap-16 items-center z-10">
        <div>
            <div class="inline-block px-4 py-1 rounded-full border border-gray-500/40 bg-gray-900/20 text-gray-300 text-sm font-semibold mb-6 shadow-[0_0_10px_rgba(31, 41, 55, 0.2)]">
                v2.0 Command Center ⚡
            </div>
            <h1 class="text-5xl lg:text-7xl font-bold leading-tight mb-6">
                Manage Operations <br>
                <span class="neon-text">At Light Speed.</span>
            </h1>
            <p class="text-slate-400 text-lg mb-8 max-w-lg leading-relaxed">
                Take absolute control of your business architecture with our next-gen dashboard. Unprecedented visibility. Real-time metrics.
            </p>
            <div class="flex gap-4">
                <button class="glow-button px-8 py-4 rounded-lg font-bold text-white text-lg flex items-center gap-2">
                    Initialize System
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </button>
                <button class="glass-panel px-8 py-4 rounded-lg font-bold text-white hover:bg-white/5 transition">
                    View Logs
                </button>
            </div>
        </div>
        
        <!-- Graphic -->
        <div class="relative">
            <div class="glass-panel rounded-2xl p-4 transform perspective-1000 rotate-y-[-10deg] rotate-x-[5deg] shadow-[20px_20px_50px_rgba(0,0,0,0.5)] border-t border-l border-white/10">
                <div class="flex items-center gap-2 mb-4 px-2">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                </div>
                <!-- Mockup Grid -->
                <div class="grid grid-cols-3 gap-4">
                    <div class="col-span-2 h-40 bg-slate-800/50 rounded-lg p-4 border border-slate-700/50 flex flex-col justify-end">
                        <div class="w-full h-24 bg-gradient-to-t from-gray-500/20 to-transparent border-b-2 border-gray-400"></div>
                    </div>
                    <div class="h-40 bg-gray-900/20 rounded-lg p-4 border border-gray-500/30 font-mono text-xs text-gray-300">
                        > SYNC OK<br>
                        > DATA STREAM<br>
                        > 99.9% UPTIME
                    </div>
                    <div class="h-24 bg-slate-800/50 rounded-lg border border-slate-700/50 w-full"></div>
                    <div class="h-24 bg-slate-800/50 rounded-lg border border-slate-700/50 w-full"></div>
                    <div class="h-24 bg-slate-800/50 rounded-lg border border-slate-700/50 w-full"></div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
