    <!-- Chat Widget -->
    <script>
      (() => {
        const WIDGET_ID = "b79193de-b43f-44aa-b26c-a3ae1db9f61a";
        const WIDGET_SRC = "https://myappzchat.com/production/master/widget/embed-widget.umd.js";
        let loaded = false;
        let idleHandle = 0;

        const loadWidget = () => {
          if (loaded) return;
          loaded = true;

          const script = document.createElement("script");
          script.src = WIDGET_SRC;
          script.defer = true;
          script.dataset.widgetId = WIDGET_ID;
          document.head.appendChild(script);
        };

        const handleInteraction = () => {
          cleanup();
          loadWidget();
        };

        const cleanup = () => {
          if ("cancelIdleCallback" in window) {
            window.cancelIdleCallback(idleHandle);
          } else {
            window.clearTimeout(idleHandle);
          }

          window.removeEventListener("pointerdown", handleInteraction);
          window.removeEventListener("keydown", handleInteraction);
          window.removeEventListener("touchstart", handleInteraction);
        };

        if ("requestIdleCallback" in window) {
          idleHandle = window.requestIdleCallback(loadWidget, { timeout: 4000 });
        } else {
          idleHandle = window.setTimeout(loadWidget, 4000);
        }

        window.addEventListener("pointerdown", handleInteraction, { once: true, passive: true });
        window.addEventListener("keydown", handleInteraction, { once: true });
        window.addEventListener("touchstart", handleInteraction, { once: true, passive: true });
      })();
    </script>
